name: Release

# Cut a release by pushing a tag that matches the version in pyproject.toml and
# __version__, or run this workflow by hand and pass the version. It publishes
# the lean source bundle plus a pre-built executable for each platform:
#
#   ppt-template-to-pdf-<version>.zip    the lean source bundle
#   ppt-template-to-pdf-<version>-windows-x64.exe    Windows, 64-bit
#   ppt-template-to-pdf-<version>-windows-x86.exe    Windows, 32-bit
#   ppt-template-to-pdf-<version>-macos-arm64        macOS on Apple silicon
#   ppt-template-to-pdf-<version>-macos-x86_64       macOS on Intel
#   ppt-template-to-pdf-<version>-linux-x86_64       Linux, 64-bit
#
# The executables are built with Nuitka (Nuitka-Action), one per architecture,
# and each one is smoke tested on its own runner before it is published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.9.0. A leading v is accepted."
        required: true
        type: string
      draft:
        description: "Create the release as a draft instead of publishing it."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve the tag and the version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$REF_NAME"
          fi
          version="${version#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::'$version' is not a version such as 1.9.0"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version as tag v$version"

  bundle:
    name: Source bundle (zip)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r requirements-dev.txt
          python -m pytest -q

      - name: Build the zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # The binaries in this workflow are built by Nuitka-Action on their own
        # runners, so this job only needs the zip.
        run: python tools/make_github_release.py --zip-only --expect-version "$VERSION"

      - name: Check the zip holds only the release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/ppt-template-to-pdf-$VERSION.zip"
          unzip -Z1 "$archive"
          if unzip -Z1 "$archive" | grep -Eq '/(tests|assets)/|requirements-dev\.txt|__pycache__|\.venv'; then
            echo "::error::The release zip contains tests, assets, or development files."
            exit 1
          fi

      - name: Install the zip and run the tool
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          unzip -q "dist/ppt-template-to-pdf-$VERSION.zip" -d build
          python -m pip install --disable-pip-version-check --quiet "build/ppt-template-to-pdf-$VERSION"
          ppt-template-to-pdf --version

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: source-bundle
          path: dist/ppt-template-to-pdf-*.zip
          if-no-files-found: error

  windows:
    name: Windows executable (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the ${{ matrix.arch }} Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Install the runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet -r requirements.txt
          python -c "import platform, struct, sys; print(sys.version); print(platform.machine(), struct.calcsize('P') * 8, 'bit')"

      - name: Run the tests
        run: |
          python -m pip install --disable-pip-version-check --quiet -r requirements-dev.txt
          python -m pytest -q

      - name: Build the executable with Nuitka
        uses: Nuitka/Nuitka-Action@v1.5
        with:
          nuitka-version: "4.4"
          script-name: ppt_template_to_pdf.py
          mode: onefile
          output-dir: dist
          output-file: ppt-template-to-pdf-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.exe
          windows-icon-from-ico: assets/logo.ico
          windows-console-mode: force
          include-package: win32com
          include-package-data: pptx
          company-name: ppt-template-to-pdf
          product-name: ppt-template-to-pdf
          file-description: Fill a PowerPoint template from YAML or JSON and export it to PDF
          file-version: ${{ needs.version.outputs.version }}
          product-version: ${{ needs.version.outputs.version }}
          copyright: MIT licensed
          assume-yes-for-downloads: true

      - name: Smoke test the executable
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $exe = "dist/ppt-template-to-pdf-$env:VERSION-windows-$env:ARCH.exe"
          if (-not (Test-Path $exe)) { throw "Nuitka did not produce $exe" }
          Get-Item $exe | Select-Object Name, Length
          & $exe --version
          if ($LASTEXITCODE) { throw "--version exited with $LASTEXITCODE" }
          & $exe "assets/screenshots/demo-template.pptx" --list-fields
          if ($LASTEXITCODE) { throw "--list-fields exited with $LASTEXITCODE" }
          $json = '{ "TRANSACTION_TITLE": "CI build", "SUMMARY": "Nuitka build works", "DISCLAIMER": "Internal" }'
          Set-Content -Path smoke.json -Value $json -Encoding utf8
          & $exe "assets/screenshots/demo-template.pptx" smoke.json -o smoke-out --no-pdf
          if ($LASTEXITCODE) { throw "filling exited with $LASTEXITCODE" }
          if (-not (Get-ChildItem smoke-out -Filter *.pptx)) { throw "The executable wrote no PPTX" }

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS executable (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r requirements.txt
          python -c "import platform, sys; print(sys.version); print(platform.machine())"

      - name: Build the executable with Nuitka
        uses: Nuitka/Nuitka-Action@v1.5
        with:
          nuitka-version: "4.4"
          script-name: ppt_template_to_pdf.py
          mode: onefile
          output-dir: dist
          output-file: ppt-template-to-pdf-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}
          include-package-data: pptx
          assume-yes-for-downloads: true

      - name: Smoke test the executable
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          exe="dist/ppt-template-to-pdf-$VERSION-macos-$ARCH"
          chmod +x "$exe"
          ls -l "$exe"
          sw_vers
          # Record the deployment target the binary will ask for at run time.
          otool -l "$exe" | grep -A4 -m1 "LC_BUILD_VERSION" || true
          "$exe" --version
          "$exe" "assets/screenshots/demo-template.pptx" --list-fields
          printf '%s' '{ "TRANSACTION_TITLE": "CI build", "SUMMARY": "Nuitka build works", "DISCLAIMER": "Internal" }' > smoke.json
          "$exe" "assets/screenshots/demo-template.pptx" smoke.json -o smoke-out --no-pdf
          ls -l smoke-out
          test -n "$(ls smoke-out/*.pptx)"

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-macos-${{ matrix.arch }}
          path: dist/ppt-template-to-pdf-*-macos-*
          if-no-files-found: error

  linux:
    name: Linux executable (x86_64)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r requirements.txt
          python -c "import platform, sys; print(sys.version); print(platform.machine())"
          # The glibc shipped here is the floor the binary will run on.
          ldd --version | head -1

      - name: Build the executable with Nuitka
        uses: Nuitka/Nuitka-Action@v1.5
        with:
          nuitka-version: "4.4"
          script-name: ppt_template_to_pdf.py
          mode: onefile
          output-dir: dist
          output-file: ppt-template-to-pdf-${{ needs.version.outputs.version }}-linux-x86_64
          include-package-data: pptx
          assume-yes-for-downloads: true

      - name: Smoke test the executable
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          exe="dist/ppt-template-to-pdf-$VERSION-linux-x86_64"
          chmod +x "$exe"
          ls -l "$exe"
          file "$exe" || true
          "$exe" --version
          "$exe" "assets/screenshots/demo-template.pptx" --list-fields
          printf '%s' '{ "TRANSACTION_TITLE": "CI build", "SUMMARY": "Nuitka build works", "DISCLAIMER": "Internal" }' > smoke.json
          "$exe" "assets/screenshots/demo-template.pptx" smoke.json -o smoke-out --no-pdf
          ls -l smoke-out
          test -n "$(ls smoke-out/*.pptx)"
          # PDF export needs Windows; the binary must say so rather than crash.
          if "$exe" "assets/screenshots/demo-template.pptx" smoke.json -o smoke-pdf; then
            echo "::error::PDF export should have been refused on Linux"
            exit 1
          fi

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-linux-x86_64
          path: dist/ppt-template-to-pdf-*-linux-*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, bundle, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Collect the assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List the assets
        run: ls -lh release-assets

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Release $VERSION of ppt-template-to-pdf: a Python script that fills a
          PowerPoint template from YAML or JSON and exports the deck to PDF.

          ## Pre-built executables (no Python needed)

          | File | Runs on |
          | --- | --- |
          | \`ppt-template-to-pdf-$VERSION-windows-x64.exe\` | Windows, 64-bit |
          | \`ppt-template-to-pdf-$VERSION-windows-x86.exe\` | Windows, 32-bit, and 64-bit Windows |
          | \`ppt-template-to-pdf-$VERSION-macos-arm64\` | macOS on Apple silicon (M1 and later) |
          | \`ppt-template-to-pdf-$VERSION-macos-x86_64\` | macOS on Intel |
          | \`ppt-template-to-pdf-$VERSION-linux-x86_64\` | Linux, 64-bit |

          Each one is a single file with the Python runtime and every dependency
          inside, built with Nuitka. Copy it anywhere and run it from a terminal:

              chmod +x ppt-template-to-pdf-$VERSION-linux-x86_64
              ./ppt-template-to-pdf-$VERSION-linux-x86_64 --help
              ./ppt-template-to-pdf-$VERSION-linux-x86_64 "Template.pptx" "Deal data.yaml"

          Desktop PowerPoint is needed for PDF export and for reading legacy .ppt
          and .pot templates, and it only exists on Windows. On macOS and Linux the
          binaries fill the .pptx and stop there; add --no-pdf, then convert the deck
          with LibreOffice (soffice --headless --convert-to pdf) if you need a PDF.

          The Linux binary is built on Ubuntu 22.04, so it needs glibc 2.35 or newer:
          Ubuntu 22.04+, Debian 12+, Fedora 36+, RHEL 10+. macOS builds target
          macOS 11 or newer. Binaries downloaded through a browser need the executable
          bit restored with chmod +x; if macOS refuses to run one, clear the quarantine
          flag with \`xattr -d com.apple.quarantine <file>\`.

          ## Source bundle

          \`ppt-template-to-pdf-$VERSION.zip\` unpacks into a folder holding only:

          - ppt_template_to_pdf.py - the script
          - README.md - the full documentation
          - pyproject.toml - installs the ppt-template-to-pdf command
          - requirements.txt - the runtime dependencies
          - LICENSE - MIT

              unzip ppt-template-to-pdf-$VERSION.zip
              python -m pip install -r ppt-template-to-pdf-$VERSION/requirements.txt
              python ppt-template-to-pdf-$VERSION/ppt_template_to_pdf.py "Template.pptx" "Deal data.yaml"

          Or install the console command:

              python -m pip install ./ppt-template-to-pdf-$VERSION
              ppt-template-to-pdf "Template.pptx" "Deal data.yaml"

          Tests, screenshots, and development requirements stay in the repository.
          EOF
          draft=""
          if [ "$DRAFT" = "true" ]; then draft="--draft"; fi
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ppt-template-to-pdf $VERSION" \
            --notes-file "$notes" \
            $draft
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
