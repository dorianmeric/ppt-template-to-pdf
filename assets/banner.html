<!doctype html>
<!-- Source for banner.png. Render with:
     msedge --headless --hide-scrollbars --window-size=1280,640 \
            --screenshot=assets/banner.png assets/banner.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: #0d1117;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #e6edf3;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(620px 400px at 88% 4%, rgba(255, 92, 92, 0.14), transparent 72%),
      radial-gradient(520px 340px at 100% 100%, rgba(120, 170, 255, 0.07), transparent 72%);
  }
  .wrap {
    position: relative; height: 100%;
    display: flex; align-items: center; gap: 64px;
    padding: 0 88px; box-sizing: border-box;
  }
  .mark { width: 320px; height: 320px; flex: none; }
  .rule { width: 96px; height: 8px; border-radius: 4px; background: #ff5c5c; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 76px; line-height: 1.04; letter-spacing: -1.5px; font-weight: 650; }
  p { margin: 22px 0 0; font-size: 31px; line-height: 1.4; color: #a7b3c0; max-width: 720px; }
  .meta {
    margin-top: 34px; font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 21px; color: #8b98a5;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <img class="mark" src="logo-dark.svg" alt="">
    <div>
      <div class="rule"></div>
      <h1>ppt-template-to-pdf</h1>
      <p>Fill a PowerPoint template from YAML.<br>Get the PPTX and the PDF back.</p>
      <div class="meta">Windows · PowerPoint · python-pptx</div>
    </div>
  </div>
</body>
</html>
